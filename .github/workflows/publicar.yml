# Publica o jogo no GitHub Pages (site estático: o modo online funciona, pois usa o servidor público do PeerJS).
# Roda ao criar uma tag de versão (ex.: git tag v3.4.6 && git push --tags) ou manualmente na aba Actions.
# Antes da primeira vez: no repositório, Settings → Pages → Source: "GitHub Actions".
name: Publicar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Montar o site (o jogo vira o index.html)
        run: |
          mkdir site
          cp dist/*.html site/
          cp dist/*.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
